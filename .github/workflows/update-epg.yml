name: Update EPG (epg.xml)

on:
  schedule:
    - cron: '0 16 * * *'   # 北京时间每天 00:00 触发（GitHub cron 为 UTC，16:00 UTC = 00:00 北京时间）
  workflow_dispatch:        # 允许在 Actions 页面手动运行

permissions:
  contents: write           # 允许工作流把生成的 epg.xml 提交回仓库

jobs:
  update-epg:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download & decompress erw EPG -> epg.xml
        run: |
          set -euo pipefail
          curl -fsSL "https://gitee.com/taksssss/tv/raw/main/epg/erw.xml.gz" -o erw.xml.gz
          gunzip -f -c erw.xml.gz > epg.xml
          rm -f erw.xml.gz
          echo "epg.xml size: $(wc -c < epg.xml) bytes"

      - name: Remove stale artifacts
        run: git rm --ignore-unmatch 112114.xml epg.xml.gz || true

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add epg.xml
          if git diff --cached --quiet; then
            echo "No changes, skipping commit"
          else
            git commit -m "chore(epg): update epg.xml from erw source"
            git push
          fi
