name: Update EPG (112114.xml)

on:
  schedule:
    - cron: '0 16 * * *'   # 北京时间每天 00:00 触发（GitHub cron 为 UTC，16:00 UTC = 00:00 北京时间）
  workflow_dispatch:        # 允许在 Actions 页面手动运行

permissions:
  contents: write           # 允许工作流把解压后的文件提交回仓库

jobs:
  update-epg:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download & extract EPG
        run: |
          set -euo pipefail
          URL="https://gitee.com/taksssss/tv/raw/main/epg/112114.xml.gz"
          echo "Downloading $URL"
          curl -fL --retry 3 --retry-delay 10 -o 112114.xml.gz "$URL"
          echo "Verifying gzip magic..."
          file 112114.xml.gz
          gunzip -f 112114.xml.gz
          echo "Extracted -> $(ls -la 112114.xml)"

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add 112114.xml
          if git diff --cached --quiet; then
            echo "No changes, skipping commit"
          else
            git commit -m "chore(epg): update 112114.xml"
            git push
          fi
