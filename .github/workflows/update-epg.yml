name: Update & Merge EPG (epg.xml)

on:
  schedule:
    - cron: '0 16 * * *'   # 北京时间每天 00:00 触发（GitHub cron 为 UTC，16:00 UTC = 00:00 北京时间）
  workflow_dispatch:        # 允许在 Actions 页面手动运行

permissions:
  contents: write           # 允许工作流把合并后的文件提交回仓库

jobs:
  update-epg:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Merge EPG sources into epg.xml
        run: |
          set -euo pipefail
          python scripts/merge_epg.py
          echo "--- 产物大小 ---"
          ls -la epg.xml

      - name: Remove stale single-source artifact
        run: git rm --ignore-unmatch 112114.xml epg.xml || true

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add epg.xml.gz
          if git diff --cached --quiet; then
            echo "No changes, skipping commit"
          else
            git commit -m "chore(epg): merge EPG sources into epg.xml.gz"
            git push
          fi
